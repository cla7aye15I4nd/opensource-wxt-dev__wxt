name: 🛡️ Validate
on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build All Packages
        run: bun run buildc all

      - name: Verify Generated Virtual Modules
        run: |
          if ! git diff --exit-code -- packages/wxt/src/internal-utils/virtual-modules.ts; then
            echo "::error file=packages/wxt/src/internal-utils/virtual-modules.ts::virtual-modules.ts is out of date. Run 'bun run build' in packages/wxt (or from the root: 'bun run buildc all') and commit the updated file."
            exit 1
          fi

      - name: Basic Checks
        run: bun run check

  builds:
    name: Builds
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build All Packages
        run: bun run buildc all

  build-demo:
    name: Build Demo
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: bun run build:all
        working-directory: packages/wxt-demo

      - name: ZIP
        run: bun run wxt zip
        working-directory: packages/wxt-demo

  linux-tests-shard:
    name: Tests (Linux, ${{ matrix.shard }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      # Every package is sharded the same way; `--passWithNoTests` covers
      # packages with fewer test files than shards.
      - name: Run Tests (Coverage)
        run: bun run --workspaces test:coverage --shard=${{ matrix.shard }} --passWithNoTests --reporter=default --reporter=hanging-process

      - name: Upload Coverage
        uses: codecov/codecov-action@2320916714171c258d01dbd81040d64d798c6f8e # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Required status check: passes only if every shard passed.
  linux-tests:
    name: Tests (Linux)
    needs: linux-tests-shard
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Check Shard Results
        run: '[ "${{ needs.linux-tests-shard.result }}" = "success" ]'

  windows-tests-shard:
    name: Tests (Windows, ${{ matrix.shard }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run Tests
        run: bun run --workspaces test run --shard=${{ matrix.shard }} --passWithNoTests

  # Required status check: passes only if every shard passed.
  windows-tests:
    name: Tests (Windows)
    needs: windows-tests-shard
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Check Shard Results
        run: '[ "${{ needs.windows-tests-shard.result }}" = "success" ]'

  template:
    name: Template
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        template:
          - react
          - solid
          - svelte
          - vanilla
          - vue
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          postinstall: 'false'

      - name: Pack WXT package
        run: bun pm pack
        working-directory: packages/wxt

      - name: Install Dependencies
        run: npm i
        working-directory: templates/${{ matrix.template }}

      - name: Install Packed WXT
        run: npm i -D ../../packages/wxt/wxt-*.tgz
        working-directory: templates/${{ matrix.template }}

      - name: Type Check Template
        run: bun run compile
        if: matrix.template != 'svelte'
        working-directory: templates/${{ matrix.template }}

      - name: Type Check Template
        run: bun run check
        if: matrix.template == 'svelte'
        working-directory: templates/${{ matrix.template }}

      - name: Build Template
        run: bun run build
        working-directory: templates/${{ matrix.template }}
